<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dunk Blueprint</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dunk">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1117;--card:#161c26;--card2:#1d2532;--line:#2a3343;
  --text:#eef2f7;--muted:#8b97a8;--accent:#ff7a1a;--accent2:#ffb36b;
  --good:#3ddc97;--blue:#5aa9ff;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.45;
  padding:env(safe-area-inset-top) 0 calc(150px + env(safe-area-inset-bottom));}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header{padding:20px 0 12px}
.brand{font-family:'Barlow Condensed';font-weight:800;font-size:30px;letter-spacing:.5px;text-transform:uppercase;line-height:1}
.brand span{color:var(--accent)}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.daystrip{display:flex;gap:6px;margin:14px 0 4px;overflow-x:auto;scrollbar-width:none}
.daystrip::-webkit-scrollbar{display:none}
.dchip{flex:1;min-width:44px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 0;text-align:center;cursor:pointer;color:var(--muted)}
.dchip b{display:block;font-family:'Barlow Condensed';font-size:17px;color:var(--text)}
.dchip i{font-style:normal;font-size:10px;text-transform:uppercase;letter-spacing:.5px}
.dchip.sel{background:var(--accent);border-color:var(--accent);color:#1a0d00}
.dchip.sel b{color:#1a0d00}
.dchip.today:not(.sel){border-color:var(--accent)}
.hero{background:linear-gradient(135deg,#2a1608,#161c26 70%);border:1px solid #3a2414;border-radius:18px;padding:16px;margin:12px 0}
.hero .tag{display:inline-block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--accent2);background:#ff7a1a22;border-radius:6px;padding:3px 8px}
.hero h2{font-family:'Barlow Condensed';font-size:28px;font-weight:700;text-transform:uppercase;margin:8px 0 2px;line-height:1.05}
.hero p{color:#c4ccd8;font-size:14px}
.prog{height:6px;background:#ffffff14;border-radius:4px;margin-top:12px;overflow:hidden}
.prog div{height:100%;background:var(--accent);width:0;transition:width .3s}
.progtxt{font-size:12px;color:var(--muted);margin-top:5px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin:8px 0 14px}
.seg button{flex:1;background:none;border:0;color:var(--muted);font:600 13px Inter;padding:8px 4px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--card2);color:var(--text)}
h3.sec{font-family:'Barlow Condensed';font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.5px;margin:20px 0 4px;display:flex;align-items:center;gap:8px}
h3.sec .n{background:var(--accent);color:#1a0d00;border-radius:6px;font-size:13px;padding:1px 7px}
.secnote{color:var(--muted);font-size:13px;margin-bottom:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin:8px 0}
.ex{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ex h4{font-size:15px;font-weight:600}
.ex .rx{font-family:'Barlow Condensed';font-weight:700;font-size:17px;color:var(--accent2);white-space:nowrap}
.ex p{color:var(--muted);font-size:13px;margin-top:3px}
.sets{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap;align-items:center}
.set{width:42px;height:42px;border-radius:11px;border:1.5px solid var(--line);background:var(--card2);color:var(--muted);font:700 15px 'Barlow Condensed';cursor:pointer}
.set.done{background:var(--good);border-color:var(--good);color:#04261a}
.restbtn{margin-left:auto;background:none;border:1px solid var(--line);color:var(--blue);font:600 12px Inter;border-radius:9px;padding:8px 10px;cursor:pointer}
.check{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.box{flex:none;width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line);background:var(--card2);display:grid;place-items:center;margin-top:1px}
.check.done .box{background:var(--good);border-color:var(--good)}
.check.done .box::after{content:'';width:6px;height:11px;border:solid #04261a;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check.done h4{text-decoration:line-through;color:var(--muted)}
.check h4{font-size:15px;font-weight:600}
.check .t{font-size:11px;font-weight:600;color:var(--accent2);text-transform:uppercase;letter-spacing:.6px}
.check p{color:var(--muted);font-size:13px;margin-top:2px}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:5px;margin-left:6px;vertical-align:1px}
.badge.carb{background:#ffb36b26;color:var(--accent2)}
.badge.swap{background:#5aa9ff22;color:var(--blue)}
.rest{text-align:center;padding:26px 16px}
.rest .big{font-size:44px}
.rule{display:flex;gap:12px}
.rule .num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#1a0d00;font:800 16px 'Barlow Condensed';display:grid;place-items:center}
.rule h4{font-size:15px}
.rule p{color:var(--muted);font-size:13px;margin-top:2px}
.dunk{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.stat{background:var(--card2);border-radius:12px;padding:10px;text-align:center}
.stat .v{font:800 30px 'Barlow Condensed';line-height:1}
.stat .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:4px}
.stepper{display:flex;justify-content:center;gap:8px;margin-top:8px}
.stepper button{width:34px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:17px;cursor:pointer}
.alert{background:#3ddc9718;border:1px solid #3ddc9755;color:var(--good);border-radius:10px;padding:9px 11px;font-size:13px;margin-top:10px;display:none}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px}
.toggle p{color:var(--muted);font-size:13px}
.ghost{background:none;border:1px solid var(--line);color:var(--muted);font:500 13px Inter;border-radius:10px;padding:9px 12px;cursor:pointer;width:100%;margin-top:16px}
/* timer */
.timer{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:#0d1117ee;backdrop-filter:blur(10px);border-top:1px solid var(--line);z-index:9}
.timer .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
.tclock{font:800 34px 'Barlow Condensed';min-width:84px;font-variant-numeric:tabular-nums}
.tclock.run{color:var(--accent)}
.tclock.end{color:var(--good)}
.tbtns{display:flex;gap:6px;flex:1;justify-content:flex-end}
.tbtns button{background:var(--card);border:1px solid var(--line);color:var(--text);font:600 13px Inter;border-radius:10px;padding:10px 11px;cursor:pointer}
.tbtns .stop{color:#ff6b6b}
.tlabel{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Dunk <span>Blueprint</span></div>
    <div class="sub">Snap Fitness Nambour · Home</div>
    <div class="daystrip" id="days"></div>
  </header>

  <div class="hero" id="hero"></div>

  <div class="seg" id="tabs">
    <button data-t="train" class="on">Train</button>
    <button data-t="eat">Eat</button>
    <button data-t="rules">Rules</button>
  </div>

  <main id="view"></main>
</div>

<div class="timer">
  <div class="in">
    <div><div class="tlabel">Rest timer</div><div class="tclock" id="clock">0:00</div></div>
    <div class="tbtns">
      <button data-s="60">1:00</button>
      <button data-s="120">2:00</button>
      <button data-s="180">3:00</button>
      <button class="stop" id="tstop">✕</button>
    </div>
  </div>
</div>

<script>
// ---------- storage (safe) ----------
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){return d} },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const mem = {};
function S(k,d){ return k in mem ? mem[k] : (mem[k]=store.get(k,d)); }
function W(k,v){ mem[k]=v; store.set(k,v); }

// ---------- dates ----------
const DN = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const now = new Date();
const todayIdx = now.getDay();
// dates for the current Mon–Sun week
function weekDate(idx){
  const d = new Date(now); const offset = ((idx+6)%7) - ((todayIdx+6)%7);
  d.setDate(d.getDate()+offset); return d;
}
function key(d){ return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }

let sel = todayIdx;
let tab = 'train';

// ---------- workout library ----------
const WARMUP = {title:'Neural Warm-up', note:'Every workout day.', items:[
  {n:'Backwards Walking', rx:'5 min', d:'Pumps blood into the patellar tendons to prep your springs.', sets:1, check:true},
  {n:'Progressive Pogo Jumps', rx:'3 × 15', d:'Start gentle. Last 5 of each set as high and fast as possible — ankles only.', sets:3},
]};
const SHOCK = {title:'Shock Block', note:'Rest 3 full minutes between sets. 100% violent effort every rep. Mat or court — no bare concrete.', rest:180, items:[
  {n:'Knees-to-Feet Box Jumps', rx:'3 × 4', d:'Explode from knees straight onto feet, then jump up.', sets:3},
  {n:'True Depth Jumps', rx:'3 × 4', d:'Step off a 12-inch box, hit the ground, instantly rebound as high as humanly possible.', sets:3},
]};
const DUNKS = {title:'Max-Effort Hoop Dunks', home:true, note:'At home, before gym. Hoop at a height you can just barely dunk. Rest 2 full minutes between sets.', rest:120, dunk:true, items:[
  {n:'Hoop Dunks', rx:'5 × 3', d:'Long, low second-to-last step.', sets:5},
]};
const FINISH = {title:'Structural Finish', note:'Knee health & core.', rest:60, items:[
  {n:'Patrick Steps', rx:'2 × 10 / leg', d:'Back heel slightly elevated, tap front heel out in front, return.', sets:2},
  {n:'Core Flow', rx:'3 rounds', d:'Bicycle Crunches ×10 → Russian Twists ×10 → Scissor Kicks ×10 → Heel Taps ×10. No rest within a round, 60 s between rounds.', sets:3},
]};
function power(load){
  return {title:'Power Engine', note:'Rest 2–3 minutes between sets. Move the weight as fast as humanly possible.', rest:150, items:[
    {n:'Hex Bar Deadlifts', rx:'3 × 4', d:(load==='heavy'?'Load it HEAVY today. ':'Moderate load today. ')+'Max speed off the floor. No slow grinds.', sets:3},
    ...(load==='fri' ? [] : [{n:'Hack Squats', rx:'3 × 6', d:'Lower smoothly for 2 seconds, then explode up violently.', sets:3}]),
    {n:'Single-Leg Calf Raises', rx:'3 × 8 / leg', d:'Hold a dumbbell, explode onto toes, hold the top 1 second for ankle stiffness.', sets:3},
  ]};
}
const LIGHT = {title:'Light Gym Session', note:'At Snap. Warm-up first, skip ALL jumps.', rest:150, items:[
  {n:'Hex Bar Deadlifts', rx:'3 × 5', d:'Smooth and fast. Not a max day.', sets:3},
  {n:'Hack Squats', rx:'3 × 8', d:'Controlled down, fast up.', sets:3},
]};
const CORE_ONLY = {title:'Core Flow', note:'Rest 60 s between rounds.', rest:60, items:[
  {n:'Core Flow', rx:'3 rounds', d:'Bicycle Crunches ×10 → Russian Twists ×10 → Scissor Kicks ×10 → Heel Taps ×10.', sets:3},
]};

function fridayMode(){ return S('friMode','light'); }

// ---------- days ----------
const DAYS = {
  1:{tag:'Heavy Training Day', title:'Heavy Gym Power', where:'Snap Fitness Nambour', blurb:'Full Master Workout. Load the hex bar heavy.', carbs:true,
     blocks:()=>[WARMUP,SHOCK,power('heavy'),FINISH]},
  2:{tag:'Active Rest & Skills', title:'Skills Day', where:'Driveway or local court', blurb:'No lifting, no max jumping.',
     tasks:[{n:'Ball-handling & form shooting',t:'45 min',d:'Driveway or local court. Keep it skill-focused.'},
            {n:'Sauna (optional)',t:'15–20 min',d:'If you feel like it.'}]},
  3:{tag:'Surf + Heavy Training', title:'Explosive Gym Speed', where:'Beach → Snap Fitness', blurb:'Surf homeschool group in the morning, full workout later. Moderate hex bar.', carbs:true, oats:true,
     pre:[{n:'Surf Homeschool Group',t:'Morning',d:'Nambour → beach. Oats breakfast for paddling fuel.'}],
     blocks:()=>[WARMUP,SHOCK,power('mod'),FINISH]},
  4:{tag:'Club Game Night', title:'Game Night', where:'Club basketball', blurb:'No gym or extra workouts today.', game:true,
     tasks:[{n:'Greek yoghurt + honey',t:'45 min before tip-off',d:'Launch fuel.'},
            {n:'Electrolytes',t:'All day',d:'Stay hydrated.'},
            {n:'Club Basketball Game',t:'Tonight',d:'Play hard.'}]},
  5:{tag:'Mooloolaba + Lift', title:'Friday', where:'Mooloolaba → Snap', carbs:true, fri:true,
     pre:[{n:'Beach hangout at Mooloolaba',t:'Morning',d:'Pack your sandwich or grab a grilled chicken wrap.'}],
     post:[{n:'Youth Group',t:'Tonight',d:''}],
     blocks:()=> fridayMode()==='dunk' ? [WARMUP,DUNKS,power('fri'),FINISH] : [WARMUP,LIGHT,CORE_ONLY]},
  6:{tag:'Early Basketball Training', title:'Saturday Training', where:'7:00 AM session', blurb:'Quick fuel on waking, real breakfast after.', sat:true,
     tasks:[{n:'Banana + honey or granola bar',t:'6:15 AM',d:'Right when you wake up.'},
            {n:'Basketball Training',t:'7:00 AM',d:''},
            {n:'3 eggs + toast',t:'After training',d:'Your recovery breakfast.'}]},
  0:{tag:'Total System Reboot', title:'Rest Day', where:'Anywhere but the gym', blurb:'Recovery is where you grow.', rest:true,
     tasks:[{n:'Sleep in',t:'9–10 hrs',d:''},{n:'Drink plenty of water',t:'All day',d:''},{n:'Sauna (optional)',t:'15–20 min',d:''}]},
};

// ---------- meals ----------
function meals(i){
  const d = DAYS[i]; const m = [];
  if(d.sat){
    m.push({id:'wake',t:'6:15 AM',n:'Wake-up fuel',d:'Banana with honey, or a granola bar.'});
    m.push({id:'bk',t:'After training',n:'Recovery breakfast',d:'3 large eggs (scrambled/fried), 2 slices wholemeal toast with a thin spread of jam/honey, 1 glass of orange juice.'});
  } else if(d.oats){
    m.push({id:'bk',t:'Breakfast',n:'Big bowl of oats',swap:'Surf swap',d:'Oats with milk, honey and a sliced banana — better fuel for paddling.'});
  } else {
    m.push({id:'bk',t:'Breakfast',n:'Eggs & toast',d:'3 large eggs (scrambled/fried), 2 slices wholemeal toast with a thin spread of jam/honey, 1 glass of orange juice.'});
  }
  m.push({id:'snk',t:'Morning snack',n:'Fruit, almonds, yoghurt',d:'1 banana or apple, a handful of almonds (30 g), and yoghurt.'});
  m.push({id:'lun',t:'Lunch',n:'Chicken or turkey sandwich',d:'Thick wholemeal bread with lettuce, tomato and cheese, plus a small bag of pretzels and a carton of milk.'+(d.fri?' Pack it for the beach, or grab a grilled chicken wrap at Mooloolaba.':'')});
  if(d.blocks || d.game){
    m.push({id:'pre',t:d.game?'45 min before tip-off':'45 min before workout',n:'Greek yoghurt + honey',d:'1 cup (200 g) low-fat Greek yoghurt with 1 large tbsp honey.'});
  }
  m.push({id:'din',t:'Dinner',n:'Protein + carbs + greens',carb:d.carbs,d:'150 g lean beef, chicken or salmon + '+(d.carbs?'TWO':'1 large')+' plate'+(d.carbs?'s':'')+' of carbs (sweet potato, pasta or rice) + a generous serving of green veg.'});
  m.push({id:'bed',t:'Before bed',n:'Growth snack',d:'1 glass of warm milk and 1 granola bar.'});
  return m;
}

// ---------- progress state ----------
function dayKey(){ return 'd:'+key(weekDate(sel)); }
function state(){ return S(dayKey(),{}); }
function toggle(id, val){ const s = {...state()}; if(val===undefined) s[id]=!s[id]; else s[id]=val; W(dayKey(), s); }

function trainUnits(){
  const d = DAYS[sel]; const ids=[];
  (d.pre||[]).forEach((_,j)=>ids.push('pre'+j));
  if(d.blocks) d.blocks().forEach((b,bi)=>b.items.forEach((it,ii)=>{ for(let s=0;s<it.sets;s++) ids.push(`b${b.title}|${it.n}|${s}`); }));
  (d.tasks||[]).forEach((_,j)=>ids.push('task'+j));
  (d.post||[]).forEach((_,j)=>ids.push('post'+j));
  return ids;
}
function mealUnits(){ return meals(sel).map(m=>'m'+m.id); }

// ---------- render ----------
const $ = s=>document.querySelector(s);
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function renderDays(){
  const order=[1,2,3,4,5,6,0];
  $('#days').innerHTML = order.map(i=>{
    const dt = weekDate(i);
    return `<div class="dchip ${i===sel?'sel':''} ${i===todayIdx?'today':''}" data-d="${i}"><i>${DN[i]}</i><b>${dt.getDate()}</b></div>`;
  }).join('');
}

function renderHero(){
  const d = DAYS[sel]; const st = state();
  const units = [...trainUnits(), ...mealUnits()];
  const done = units.filter(u=>st[u]).length;
  const pct = units.length? Math.round(done/units.length*100):0;
  let title=d.title, blurb=d.blurb||'';
  if(d.fri){
    title = fridayMode()==='dunk' ? 'Dunk Practice + Power' : 'Light Lift Day';
    blurb = fridayMode()==='dunk' ? 'Dunks at home, then modified power engine at Snap.' : 'Beach morning, light Snap session, youth group tonight.';
  }
  $('#hero').innerHTML = `
    <span class="tag">${sel===todayIdx?'Today · ':''}${esc(d.tag)}</span>
    <h2>${esc(title)}</h2>
    <p>${esc(d.where)}${blurb?' · '+esc(blurb):''}</p>
    <div class="prog"><div style="width:${pct}%"></div></div>
    <div class="progtxt">${done} of ${units.length} done today${d.carbs?' · Double carbs at dinner':''}</div>`;
}

function checkRow(id, title, time, desc, extra=''){
  const done = state()[id];
  return `<div class="card"><div class="check ${done?'done':''}" data-c="${esc(id)}">
    <div class="box"></div><div style="flex:1">${time?`<div class="t">${esc(time)}</div>`:''}<h4>${esc(title)}${extra}</h4>${desc?`<p>${esc(desc)}</p>`:''}</div></div></div>`;
}

function renderTrain(){
  const d = DAYS[sel]; const st = state(); let h='';
  if(d.fri){
    const m = fridayMode();
    h += `<div class="card toggle"><div><h4 style="font-size:15px">Friday plan</h4><p>Legs heavy or can't hit your usual height? Go Light (CNS check).</p></div></div>
    <div class="seg" id="frimode" style="margin-top:-2px"><button data-f="light" class="${m==='light'?'on':''}">Light Lift</button><button data-f="dunk" class="${m==='dunk'?'on':''}">Dunk + Power</button></div>`;
  }
  (d.pre||[]).forEach((p,j)=> h+=checkRow('pre'+j,p.n,p.t,p.d));
  if(d.blocks){
    let n=0;
    d.blocks().forEach(b=>{
      n++;
      h += `<h3 class="sec"><span class="n">${n}</span>${esc(b.title)}${b.home?' <span class="badge swap">Home</span>':''}</h3><div class="secnote">${esc(b.note)}</div>`;
      b.items.forEach(it=>{
        let sets='';
        if(it.check && it.sets===1){
          const id=`b${b.title}|${it.n}|0`;
          sets = `<button class="set ${st[id]?'done':''}" data-c="${esc(id)}" style="width:auto;padding:0 14px">${st[id]?'Done':'Mark done'}</button>`;
        } else {
          for(let s=0;s<it.sets;s++){ const id=`b${b.title}|${it.n}|${s}`; sets+=`<button class="set ${st[id]?'done':''}" data-c="${esc(id)}">${s+1}</button>`; }
          if(b.rest) sets += `<button class="restbtn" data-s="${b.rest}">Rest ${fmt(b.rest)}</button>`;
        }
        h += `<div class="card"><div class="ex"><div><h4>${esc(it.n)}</h4><p>${esc(it.d)}</p></div><div class="rx">${esc(it.rx)}</div></div><div class="sets">${sets}</div></div>`;
      });
      if(b.dunk) h += dunkTracker();
    });
  }
  if(d.tasks){
    if(d.rest) h += `<div class="card rest"><div class="big">😴</div><h4 style="margin-top:6px">Total rest</h4><p style="color:var(--muted);font-size:13px">Relax and let your body recover.</p></div>`;
    d.tasks.forEach((t,j)=> h+=checkRow('task'+j,t.n,t.t,t.d));
  }
  if(d.post){ h += `<h3 class="sec">Tonight</h3>`; d.post.forEach((p,j)=> h+=checkRow('post'+j,p.n,p.t,p.d)); }
  h += `<button class="ghost" id="reset">Reset this day</button>`;
  return h;
}

function dunkTracker(){
  const hgt = S('hoop',96); const streak = S('streak:'+key(weekDate(sel)),0);
  const ft = Math.floor(hgt/12), inch = hgt%12;
  return `<div class="card"><h4 style="font-size:15px">Hoop height & clean-dunk streak</h4>
    <div class="dunk">
      <div class="stat"><div class="v">${ft}'${inch}"</div><div class="l">Hoop height</div>
        <div class="stepper"><button data-h="-1">−</button><button data-h="1">+</button></div></div>
      <div class="stat"><div class="v">${streak}<span style="font-size:18px;color:var(--muted)">/5</span></div><div class="l">Clean in a row</div>
        <div class="stepper"><button data-k="miss">Miss</button><button data-k="hit">✓</button></div></div>
    </div>
    <div class="alert" style="display:${streak>=5?'block':'none'}">🎉 5 clean in a row! Raise the hoop 2–3 inches for next week.</div></div>`;
}

function renderEat(){
  const d = DAYS[sel]; let h='';
  if(d.carbs) h += `<div class="card" style="border-color:#ff7a1a55"><h4 style="font-size:15px">🍝 Recovery Rule</h4><p style="color:var(--muted);font-size:13px">Training day — double your carb portion at dinner.</p></div>`;
  if(d.rest) h += `<div class="card"><h4 style="font-size:15px">💧 Drink plenty of water today</h4></div>`;
  meals(sel).forEach(m=>{
    const extra = (m.carb?'<span class="badge carb">2× carbs</span>':'')+(m.swap?`<span class="badge swap">${esc(m.swap)}</span>`:'');
    h += checkRow('m'+m.id, m.n, m.t, m.d, extra);
  });
  return h;
}

function renderRules(){
  const R=[
    ['Graduation','Once you can clean-dunk 5 times in a row on Friday, raise your adjustable hoop 2–3 inches for the next week.'],
    ['CNS Check','If your legs feel heavy on Friday or you can\'t hit your usual height, stop dunking immediately and stick to the gym work. Recovery is where you grow.'],
    ['Fuel the Bounce','Sleep 8–9 hours a night and eat high protein so your muscles can rebuild explosive fibres fast.'],
  ];
  let h = `<h3 class="sec">Golden Rules</h3>`;
  R.forEach((r,i)=> h+=`<div class="card rule"><div class="num">${i+1}</div><div><h4>${r[0]}</h4><p>${r[1]}</p></div></div>`);
  h += `<h3 class="sec">The Week</h3>`;
  [1,2,3,4,5,6,0].forEach(i=>{
    const d=DAYS[i];
    h+=`<div class="card" data-d="${i}" style="cursor:pointer"><div class="ex"><div><h4>${DN[i]} · ${esc(d.tag)}</h4><p>${esc(d.where)}</p></div>${d.carbs?'<span class="badge carb">2× carbs</span>':''}</div></div>`;
  });
  return h;
}

function render(){
  renderDays(); renderHero();
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  $('#view').innerHTML = tab==='train'?renderTrain():tab==='eat'?renderEat():renderRules();
}

// ---------- events ----------
document.addEventListener('click',e=>{
  const t = e.target.closest('[data-d],[data-t],[data-c],[data-f],[data-h],[data-k],[data-s],#reset,#tstop');
  if(!t) return;
  if(t.id==='tstop'){ stopTimer(); return; }
  if(t.dataset.s){ startTimer(+t.dataset.s); return; }
  if(t.dataset.d!==undefined){ sel=+t.dataset.d; if(tab==='rules') tab='train'; render(); window.scrollTo({top:0,behavior:'smooth'}); return; }
  if(t.dataset.t){ tab=t.dataset.t; render(); return; }
  if(t.dataset.f){ W('friMode',t.dataset.f); render(); return; }
  if(t.dataset.h){ W('hoop',Math.max(60,Math.min(130,S('hoop',96)+ +t.dataset.h))); render(); return; }
  if(t.dataset.k){ const k='streak:'+key(weekDate(sel)); const v=S(k,0); W(k, t.dataset.k==='hit'?v+1:0); render(); return; }
  if(t.id==='reset'){ W(dayKey(),{}); render(); return; }
  if(t.dataset.c){
    const wasDone = state()[t.dataset.c];
    toggle(t.dataset.c); render();
    // auto-start rest when finishing a set (not the last one of an exercise)
    if(!wasDone && t.classList.contains('set')){
      const card = t.closest('.card'); const rb = card && card.querySelector('.restbtn');
      const left = card ? card.querySelectorAll('.set:not(.done)').length : 0;
      if(rb && left>0) startTimer(+rb.dataset.s);
    }
  }
});

// ---------- timer ----------
let end=0, iv=null, actx=null;
function fmt(s){ return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function startTimer(sec){
  try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); actx.resume&&actx.resume(); }catch(e){}
  end = Date.now()+sec*1000; clearInterval(iv); tick(); iv=setInterval(tick,250);
}
function stopTimer(){ clearInterval(iv); iv=null; const c=$('#clock'); c.textContent='0:00'; c.className='tclock'; }
function tick(){
  const left = Math.max(0,Math.ceil((end-Date.now())/1000)); const c=$('#clock');
  c.textContent=fmt(left); c.className='tclock run';
  if(left<=0){ clearInterval(iv); iv=null; c.className='tclock end'; c.textContent='GO!'; beep(); try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){} }
}
function beep(){
  if(!actx) return;
  try{ [0,0.25,0.5].forEach(t=>{ const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=880; o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(0.25,actx.currentTime+t); g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+t+0.2); o.start(actx.currentTime+t); o.stop(actx.currentTime+t+0.2); }); }catch(e){}
}

render();
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
